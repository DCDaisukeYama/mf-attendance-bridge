<!doctype html>
<!-- ===== bridge.html ===== -->
<!-- 勤怠データを受け取るブリッジページ -->
<!-- background.jsからのURLパラメータで勤怠情報を受け取り、ローカル保存と表示を行う -->
<html lang="ja" data-theme="dark">
<head>
  <meta charset="utf-8" /> <!-- 文字エンコーディングをUTF-8に指定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1" /> <!-- レスポンシブデザイン用 -->
  <title>勤怠記録ブリッジ & ログ確認</title> <!-- ページタイトル -->
  <link rel="preconnect" href="." /> <!-- パフォーマンス最適化用 -->
  <!-- ブリッジページ用のCSSスタイル（ダーク/ライトテーマ対応） -->
  <style>
    /* ===== THEME TOKENS ===== */
    /* ダークモードのカラー定義 */
    :root{
      --bg1:#0b1020; --bg2:#0d1428; --card:#121a2f; --muted:#8aa0c7; --text:#e8eefc;
      --ok:#17c964; --warn:#f5a524; --err:#f31260; --line:#203055;
      --btn-bg:#0f1730; --th-bg:#0f1730; --code-bg:#0f1730; --row-hover:#0e1630;
      --link:#9fc3ff;
    }
    /* ライトモードのカラー定義 */
    :root[data-theme="light"]{
      --bg1:#f7f9fc; --bg2:#eef3fb; --card:#ffffff; --muted:#5d6b85; --text:#0b1220;
      --ok:#0f9953; --warn:#c27c17; --err:#cc1e4a; --line:#d9e2f1;
      --btn-bg:#f0f3fa; --th-bg:#f0f3fa; --code-bg:#eff3fa; --row-hover:#f6f9ff;
      --link:#1b66d1;
    }

    /* ベーススタイル - ボックスモデルとフォント設定 */
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Helvetica,Arial,"Noto Sans JP",sans-serif;
      background:linear-gradient(180deg,var(--bg1),var(--bg1) 80%,var(--bg2));
      color:var(--text)
    }
    .wrap{max-width:1200px;margin:24px auto;padding:0 16px;overflow-x:hidden}
    h1{font-size:24px;margin:0 0 12px}
    .muted{color:var(--muted)}
    .card{
      background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;
      box-shadow:0 8px 24px rgba(0,0,0,.15); overflow:hidden; /* 子要素のはみ出し抑止 */
    }
    .grid{display:grid;gap:16px}
    @media(min-width:900px){.grid-2{grid-template-columns:1.2fr .8fr}}
    @media(max-width:899px){.grid-2{grid-template-columns:1fr}}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .btn{appearance:none;border:1px solid var(--line);background:var(--btn-bg);color:var(--text);padding:8px 12px;border-radius:10px;cursor:pointer}
    .btn:hover{filter:brightness(1.06)}
    .btn.warn{border-color:rgba(245,165,36,.4)}
    .stat{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid var(--line)}
    .dot{width:10px;height:10px;border-radius:50%}
    .okdot{background:var(--ok)} .warndot{background:var(--warn)} .errdot{background:var(--err)}

    code,kbd{
      background:var(--code-bg);border:1px solid var(--line);padding:.2em .5em;border-radius:8px;
      word-break:break-all; overflow-wrap:anywhere; white-space:pre-wrap; /* 長いURLで横スクロールさせない */
    }

    /* ==== テーブル：レスポンシブ対応 ==== */
    .table-container{
      overflow-x: auto;
      margin: 16px 0;
    }
    table.logtable{
      width:100%;
      border-collapse:collapse;
      border:1px solid var(--line);
      min-width: 1000px; /* 最小幅を設定 */
    }
    table.logtable th, table.logtable td{
      padding:8px 10px;
      border-bottom:1px solid var(--line);
      vertical-align:middle;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    table.logtable th{background:var(--th-bg);text-align:left;color:var(--muted)}
    tbody tr:hover{background:var(--row-hover)}
    
    /* カラム幅の調整（レスポンシブ） */
    @media (min-width: 1200px) {
      .logtable td:nth-child(1) { width: 4%; }   /* # */
      .logtable td:nth-child(2) { width: 7%; }   /* 種別 */
      .logtable td:nth-child(3) { width: 20%; }  /* 日時 */
      .logtable td:nth-child(4) { width: 10%; }  /* source */
      .logtable td:nth-child(5) { width: 12%; }  /* team */
      .logtable td:nth-child(6) { width: 12%; }  /* project */
      .logtable td:nth-child(7) { width: 15%; }  /* page */
      .logtable td:nth-child(8) { width: 5%; }   /* ref */
      .logtable td:nth-child(9) { width: 12%; }  /* 労働時間（正確） */
      .logtable td:nth-child(10) { width: 13%; } /* 労働時間（0.25h刻み） */
    }
    
    /* タブレット以下での表示調整 */
    @media (max-width: 1199px) {
      .logtable td:nth-child(4), /* source */
      .logtable th:nth-child(4) { 
        display: none; 
      }
      .logtable td:nth-child(7), /* page */
      .logtable th:nth-child(7) { 
        display: none; 
      }
    }
    
    /* スマホでの表示調整 */
    @media (max-width: 768px) {
      .logtable td:nth-child(5), /* team */
      .logtable th:nth-child(5),
      .logtable td:nth-child(8), /* ref */
      .logtable th:nth-child(8) { 
        display: none; 
      }
    }
    .badge{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);}
    .in{color:#0bd68a;background:rgba(11,214,138,.12);border-color:rgba(11,214,138,.4)}
    .out{color:#ffae33;background:rgba(255,174,51,.12);border-color:rgba(255,174,51,.4)}
    a{color:var(--link)}
    .small{font-size:12px}
    .kbd{font-variant-ligatures: no-common-ligatures;}
    .header-actions{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
    .right{display:flex;justify-content:flex-end}
    /* 日時セルだけ2行許可（JST + UTC） */
    .logtable td .dt{display:block;white-space:normal;line-height:1.25}
    .logtable td .utc{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  </style>
</head>
<body>
  <!-- メインコンテナ - 2カラムレイアウト -->
  <div class="wrap grid grid-2">
    <!-- 左カラム: メイン情報カード -->
    <div class="card">
      <!-- ヘッダーエリア（タイトルとテーマ切替ボタン） -->
      <div class="header-actions">
        <h1>勤怠記録ブリッジ</h1> <!-- メインタイトル -->
        <button id="themeToggle" class="btn" title="ライト/ダーク切替">🌗 テーマ切替</button> <!-- テーマ切替ボタン -->
      </div>
      <!-- ページ説明テキスト -->
      <p class="muted">このページは拡張機能から <code class="kbd">?action=&timestamp=</code> を受け取り、
        <b>ローカル保存</b>（任意でAPI連携）と<b>記録確認</b>を行います。</p>

      <!-- 現在の勤怠イベントのステータス表示 -->
      <div id="status" style="margin:12px 0 16px"></div>
      <!-- アクションボタン行 -->
      <div class="row">
        <button id="btnExport" class="btn">CSVエクスポート</button> <!-- CSVエクスポートボタン -->
        <button id="btnClear" class="btn warn">ログを全消去</button> <!-- ログ全消去ボタン -->
        <span id="apiStatus" class="muted small" style="margin-left:auto"></span> <!-- API送信結果表示 -->
      </div>
    </div>

    <!-- 右カラム: 最新記録表示カード -->
    <div class="card">
      <h2 style="margin:0 0 8px">直近の記録</h2> <!-- 最新記録セクションタイトル -->
      <div id="latest" class="muted">読み込み中...</div> <!-- 最新記録の表示エリア -->
      <div id="totals" class="small" style="margin-top:12px"></div>
      <hr style="border:0;border-top:1px solid var(--line);margin:12px 0" /> <!-- 区切り線 -->
      <!-- URL例表示エリア -->
      <div class="small muted">URL例：
        <code id="exampleUrl"></code>
      </div>
    </div>

    <!-- フル幅カード: 勤怠ログ一覧テーブル -->
    <div class="card" style="grid-column:1/-1">
      <!-- テーブルヘッダー -->
      <div class="row" style="justify-content:space-between;align-items:baseline">
        <h2 style="margin:0">ログ一覧</h2> <!-- ログセクションタイトル -->
        <div class="muted small">保存先：<code>localStorage.attendanceLogs</code></div> <!-- データ保存場所の表示 -->
      </div>

      <div class="table-container">
        <table class="logtable">
          <thead>
            <tr>
              <th>#</th>
              <th>種別</th>
              <th>日時（JST / UTC）</th>
              <th>source</th>
              <th>team</th>
              <th>project</th>
              <th>page</th>
              <th>ref</th>
              <th>労働時間（正確）</th>
              <th>労働時間（0.25h刻み）</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
  <!-- ブリッジページの動作用JavaScript読み込み -->
  <script src="bridge.js" defer></script>
</body>
</html>
