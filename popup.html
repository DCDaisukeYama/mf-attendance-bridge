<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>プロジェクト切替</title>
    <style>
      /* ---------- Theme tokens ---------- */
      :root {
        --bg: #ffffff;
        --fg: #111318;
        --muted: #667085;
        --line: #e6eaf2;
        --chip: #f2f6ff;
        --head: #f6f8fc;
        --accent: #1b66d1;
        --danger: #d92d20;
        --btn: #f7f9fc;
        --btn-hover: #eef3fb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1116;
          --fg: #e6edf3;
          --muted: #98a2b3;
          --line: #263143;
          --chip: #152238;
          --head: #0f172a;
          --accent: #7db1ff;
          --danger: #ff6166;
          --btn: #0e1626;
          --btn-hover: #13203a;
        }
      }
      /* ---------- Base ---------- */
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Inter,
          "Noto Sans JP", sans-serif;
        width: 360px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        background: var(--head);
      }
      h1 {
        font-size: 16px;
        margin: 0;
      }
      button,
      input,
      select {
        font: inherit;
      }
      input[type="radio"] {
        accent-color: var(--accent);
      }
      /* ---------- Buttons ---------- */
      .btn {
        border: 1px solid var(--line);
        background: var(--btn);
        color: var(--fg);
        padding: 6px 10px;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.12s ease;
      }
      .btn:hover {
        background: var(--btn-hover);
      }
      .btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .btn.primary {
        border-color: transparent;
        background: var(--accent);
        color: #fff;
      }
      .btn.ghost {
        background: transparent;
      }
      .btn.danger {
        color: #fff;
        background: var(--danger);
        border-color: transparent;
      }
      .btn.ghost.danger {
        background: transparent;
        color: var(--danger);
        border-color: var(--line);
      }
      /* ---------- Layout ---------- */
      .wrap {
        padding: 12px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .hint {
        color: var(--muted);
        font-size: 12px;
      }
      .sec {
        border: 1px solid var(--line);
        border-radius: 12px;
        margin-top: 12px;
        overflow: hidden;
      }
      .sec > h2 {
        margin: 0;
        padding: 8px 10px;
        font-size: 13px;
        background: var(--head);
        border-bottom: 1px solid var(--line);
      }
      .team {
        padding: 8px 10px;
        border-bottom: 1px dashed var(--line);
      }
      .team:last-child {
        border-bottom: 0;
      }
      .team-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .team-name {
        font-weight: 600;
      }
      .projs {
        margin-top: 6px;
        display: grid;
        gap: 6px;
      }
      .proj {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 6px 8px;
        background: var(--chip);
      }
      .proj .left {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid var(--line);
        font-size: 12px;
        background: var(--chip);
      }
      .muted {
        color: var(--muted);
      }
      .hr {
        height: 1px;
        background: var(--line);
        margin: 10px 0;
      }
      .small {
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>プロジェクト切替</h1>
      <div class="row">
        <button id="addTeam" class="btn">＋ チーム</button>
        <button id="addProject" class="btn">＋ PJ</button>
      </div>
    </header>
    <div class="wrap">
      <div id="active" class="row" style="justify-content: space-between">
        <div class="row">
          <span class="tag">選択中</span>
          <span id="activeLabel" class="hint">未選択</span>
        </div>
        <button id="switchBtn" class="btn primary">
          このプロジェクトに切替
        </button>
      </div>
      <div class="sec">
        <h2>チーム / プロジェクト</h2>
        <div id="list"></div>
      </div>
      <div class="hr"></div>
      <div class="small muted">
        プロジェクトをクリックすると「選択中」が変わります。<br />
        <b>切替</b>を押すと現在時刻で <code>project_switch</code> を記録して
        bridge.html を開きます。
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
