<!DOCTYPE html>
<!-- ===== popup.html ===== -->
<!-- Chrome拡張機能のポップアップメニュー -->
<!-- プロジェクト切り替えと勤怠管理のメインUI -->
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>プロジェクト切替</title>
    
    <!-- 共通テーマCSS -->
    <link rel="stylesheet" href="src/common/theme.css" />
    <!-- ポップアップ専用CSS -->
    <link rel="stylesheet" href="src/common/popup.css" />
  </head>
  <body>
    <!-- ===== スプラッシュスクリーン（起動時のアニメーション） ===== -->
    <!-- 拡張機能初回起動時に表示されるブランディング画面 -->
    <div class="splash" id="splash" aria-hidden="true">
      <div class="logo-container" id="logoContainer">
        <!-- ロゴシンボル（DC文字とアニメーション要素） -->
        <div class="logo-symbol">
          <div class="logo-bg"></div>
          <!-- DC文字のアニメーション -->
          <div class="logo-letters">
            <span class="letter-d">D</span><span class="letter-c">C</span>
          </div>
          <!-- 顔のパーツ（目と笑顔のアニメーション） -->
          <div class="face-elements">
            <div class="eye left-eye"></div>
            <div class="eye right-eye"></div>
            <div class="smile"></div>
          </div>
        </div>
        <!-- 会社名とサブタイトル -->
        <div class="company-name">DreamCareer</div>
        <div class="subtitle">あなたの夢のキャリアを見つけよう</div>
      </div>
    </div>

    <!-- ヘッダー：タイトルと操作ボタン -->
    <header>
      <h1>プロジェクト切替</h1>
      <div class="row">
        <!-- テーマ切替ボタン -->
        <button id="themeToggle" class="btn small" title="ライト/ダーク/自動テーマ切替">🌗</button>
        <!-- チーム・プロジェクト追加ボタン -->
        <button id="addTeam" class="btn small">＋ チーム</button>
        <button id="addProject" class="btn small">＋ PJ</button>
      </div>
    </header>

    <div class="wrap">
      <!-- 勤怠ステータス表示カード -->
      <div class="card" id="statusCard">
        <h3 style="margin: 0 0 12px 0; font-size: 14px;">勤怠ステータス</h3>
        <div id="attendanceStatus" class="muted">読み込み中...</div>
        <button id="clockInShortcut" class="btn small" style="margin-top: 8px; display: none;">
          MoneyForwardを開く
        </button>
      </div>

      <!-- アクティブプロジェクト表示カード -->
      <div class="card">
        <div class="row" style="justify-content: space-between; margin-bottom: 12px;">
          <h3 style="margin: 0; font-size: 14px;">現在のプロジェクト</h3>
          <button id="switchBtn" class="btn small" style="display: none;">切替実行</button>
        </div>
        <div id="activeLabel" class="muted">読み込み中...</div>
      </div>

      <!-- プロジェクト選択UI -->
      <div class="card">
        <h3 style="margin: 0 0 12px 0; font-size: 14px;">プロジェクト切替</h3>
        
        <!-- チーム選択 -->
        <label style="display: block; margin-bottom: 4px; font-size: 12px; color: var(--muted);">チーム</label>
        <div id="teamCustomSelect" class="custom-select" style="margin-bottom: 12px;">
          <span id="teamDisplayText">選択してください</span>
          <div id="teamDropdown" class="select-dropdown"></div>
        </div>
        
        <!-- プロジェクト選択 -->
        <label style="display: block; margin-bottom: 4px; font-size: 12px; color: var(--muted);">プロジェクト</label>
        <div id="projectCustomSelect" class="custom-select">
          <span id="projectDisplayText">選択してください</span>
          <div id="projectDropdown" class="select-dropdown"></div>
        </div>
        
        <!-- 隠しセレクト（後方互換性） -->
        <select id="teamSelect" style="display: none;"></select>
        <select id="projectSelect" style="display: none;"></select>
        
        <!-- シート項目選択（スプレッドシート連携用） -->
        <div style="margin-top: 16px;">
          <label style="display: block; margin-bottom: 4px; font-size: 12px; color: var(--muted);">
            シート項目選択 <span id="sheetMonth" class="small muted"></span>
          </label>
          <div class="row" style="gap: 4px;">
            <div id="sheetCustomSelect" class="custom-select" style="flex: 1;">
              <span id="sheetDisplayText">シートから選択</span>
              <div id="sheetDropdown" class="select-dropdown"></div>
            </div>
            <button id="refreshSheet" class="btn small" title="再読み込み">🔄</button>
          </div>
          <select id="sheetSelect" style="display: none;"></select>
          <div id="refreshStatus" class="small muted" style="margin-top: 4px;"></div>
        </div>
      </div>

      <!-- プロジェクト内容表示カード -->
      <div id="projectContentCard" class="card" style="display: none;">
        <details>
          <summary style="cursor: pointer; font-size: 14px; font-weight: 500;">プロジェクト内容</summary>
          <div style="margin-top: 16px;">
            <div id="projectContentDisplay" class="small" style="line-height: 1.5;"></div>
          </div>
        </details>
      </div>

      <!-- メンバー選択カード -->
      <div id="memberSelectionCard" class="card" style="display: none;">
        <div class="row" style="justify-content: space-between; margin-bottom: 12px;">
          <h3 style="margin: 0; font-size: 14px;">メンバー選択</h3>
          <div class="row" style="gap: 4px;">
            <button id="selectAllMembers" class="btn small">全選択</button>
            <button id="clearAllMembers" class="btn small">全解除</button>
            <button id="confirmMemberSelection" class="btn small" style="background: var(--accent); color: white;">確定</button>
          </div>
        </div>

        <!-- グループ別メンバー選択タブ -->
        <div id="memberSelectionTabs" class="member-selection-tabs" style="margin-bottom: 12px;">
          <!-- タブボタンが動的に追加される -->
        </div>

        <!-- メンバー選択リスト -->
        <div id="memberSelectionList" class="member-selection-list">
          <div id="memberSelectionLoading" class="muted small">読み込み中...</div>
        </div>

        <!-- 選択状況表示 -->
        <div id="memberSelectionStatus" class="small muted" style="margin-top: 8px;"></div>
      </div>

      <!-- プロジェクトメンバー表示カード -->
      <div id="projectMemberCard" class="card" style="display: none;">
        <div class="row" style="justify-content: space-between; margin-bottom: 12px;">
          <h3 style="margin: 0; font-size: 14px;">プロジェクトメンバー</h3>
          <button id="refreshMembers" class="btn small" title="メンバー情報を再読み込み">🔄</button>
        </div>

        <!-- チーム内プロジェクトタブ -->
        <div id="projectTabs" class="project-tabs" style="margin-bottom: 12px; display: none;">
          <!-- タブボタンが動的に追加される -->
        </div>

        <!-- メンバーリスト表示 -->
        <div id="membersList" class="members-list">
          <div id="membersLoading" class="muted small">読み込み中...</div>
        </div>

        <!-- メンバー情報のステータス -->
        <div id="memberStatus" class="small muted" style="margin-top: 8px;"></div>
      </div>

      <!-- 設定セクション -->
      <div class="card">
        <details>
          <summary style="cursor: pointer; font-size: 14px; font-weight: 500;">設定</summary>
          
          <div style="margin-top: 16px;">
            <!-- 休憩時間設定 -->
            <h4 style="margin: 0 0 8px 0; font-size: 13px;">休憩時間設定</h4>
            <div class="row" style="margin-bottom: 12px;">
              <input type="time" id="breakStart" style="flex: 1;" />
              <span style="margin: 0 8px;">〜</span>
              <input type="time" id="breakEnd" style="flex: 1;" />
              <button id="saveBreakTime" class="btn small">保存</button>
            </div>
            <div id="breakStatus" class="small muted"></div>
          </div>

          <div style="margin-top: 16px;">
            <!-- 表示設定 -->
            <h4 style="margin: 0 0 8px 0; font-size: 13px;">表示設定</h4>
            <label style="display: flex; align-items: center; margin-bottom: 12px; font-size: 12px;">
              <input type="checkbox" id="enableStartupAnimation" />
              起動アニメーションを有効にする
            </label>
            <button id="saveDisplaySettings" class="btn small" style="margin-bottom: 16px;">保存</button>
            <div id="displaySettingsStatus" class="small muted" style="margin-bottom: 16px;"></div>
          </div>

          <div style="margin-top: 16px;">
            <!-- 勤務時間・通知設定 -->
            <h4 style="margin: 0 0 8px 0; font-size: 13px;">勤務時間・通知設定</h4>
            <div class="row" style="margin-bottom: 8px;">
              <input type="time" id="workStart" style="flex: 1;" />
              <span style="margin: 0 8px;">〜</span>
              <input type="time" id="workEnd" style="flex: 1;" />
            </div>
            
            <label style="display: flex; align-items: center; margin-bottom: 8px; font-size: 12px;">
              <input type="checkbox" id="enableNotifications" />
              通知機能を有効にする
            </label>
            
            <div id="notificationDetailsContainer" style="margin-left: 20px;">
              <label style="display: flex; align-items: center; margin-bottom: 8px; font-size: 12px;">
                <input type="checkbox" id="enablePreWorkNotification" />
                出社前通知
              </label>
              
              <label style="display: flex; align-items: center; margin-bottom: 8px; font-size: 12px;">
                <input type="checkbox" id="enableWorkEndNotification" />
                退社時通知
              </label>
              
              <div class="row" style="margin-bottom: 8px;">
                <label style="font-size: 12px; margin-right: 8px;">出社前通知:</label>
                <input type="number" id="preWorkNotifyMin" style="width: 60px;" min="1" max="120" />
                <span style="font-size: 12px; margin-left: 4px;">分前</span>
              </div>
              
              <label style="display: flex; align-items: center; font-size: 12px;">
                <input type="checkbox" id="enableWorkDays" />
                平日のみ通知
              </label>
            </div>
            
            <button id="saveWorkTime" class="btn small" style="margin-top: 8px;">保存</button>
            <div id="workTimeStatus" class="small muted" style="margin-top: 4px;"></div>
          </div>
        </details>
      </div>
    </div>

    <!-- スプレッドシート管理モジュール -->
    <script src="src/common/spreadsheet-manager.js"></script>
    <!-- メイン処理スクリプト（元の動作するpopup.js） -->
    <script src="popup.js"></script>
  </body>
</html>
